[project]
name = "sij-prep"
version = "0.1.0"
description = "Preparación de volúmenes de RM de la articulación sacroilíaca para MedSAM2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "SimpleITK",
    "matplotlib",
    "pillow",
    "requests",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbconvert",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sij_prep"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
