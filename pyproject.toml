[project]
name = "sij-prep"
version = "0.1.0"
description = "Preparación de volúmenes de RM de la articulación sacroilíaca para MedSAM2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "SimpleITK",
    "matplotlib",
    "pillow",
    "requests",
    "jupyter",
    "ipykernel",
    "nbformat",
    "nbconvert",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "huggingface_hub",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "tqdm",
    "MedSAM2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sij_prep", "src/sij_medsam2"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]

[tool.uv.sources]
MedSAM2 = { git = "https://github.com/bowang-lab/MedSAM2.git", rev = "332f30d420f1d1b08e2a79b3ae6a602458808383" }
